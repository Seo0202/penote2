<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>회차 상세</title></head>
<body>
<h1>회차 상세</h1>
<p><strong>회차 ID:</strong> <span th:text="${article.id}">1</span></p>
<p><strong>제목:</strong> <span th:text="${article.title}">제목</span></p>
<p><strong>장르:</strong> <span th:text="${article.genre}">기타</span></p>
<p><strong>유형:</strong>
    <span th:if="${article.paid}">🔒 유료 회차 (별 5개)</span>
    <span th:unless="${article.paid}">무료 회차</span>
</p>
<div th:if="${locked}">
    <h2>🔒 잠긴 회차입니다</h2>
    <p>이 회차를 읽으려면 별 5개가 필요합니다.</p>
    <form th:if="${loggedIn}" th:action="@{/articles/{id}/purchase(id=${article.id})}" method="post">
        <button type="submit">⭐ 별 5개로 구매하기</button>
    </form>
    <p th:unless="${loggedIn}"><a href="/login">로그인</a> 후 구매할 수 있습니다.</p>
</div>
<div th:unless="${locked}">
    <h2>내용</h2>
    <p style="white-space: pre-wrap" th:text="${article.content}">내용</p>
</div>
<hr>
<h2>댓글 작성</h2>
<form th:action="@{/articles/{id}/comments(id=${article.id})}" method="post">
    <label for="content">댓글</label><br>
    <textarea id="content" name="content" rows="4" cols="50" placeholder="댓글을 입력하세요"></textarea><br>
    <button type="submit">댓글 등록</button>
</form>
<h2>댓글 목록</h2>
<table border="1">
    <thead><tr><th>ID</th><th>내용</th><th>수정</th><th>삭제</th></tr></thead>
    <tbody>
    <tr th:each="comment : ${commentList}">
        <td th:text="${comment.id}">1</td>
        <td th:text="${comment.content}">내용</td>
        <td><a th:href="@{/comments/{id}/edit(id=${comment.id})}">수정</a></td>
        <td>
            <form th:action="@{/comments/{id}(id=${comment.id})}" method="post">
                <input type="hidden" name="_method" value="delete">
                <button type="submit">삭제</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>
<p><a href="/articles">회차 목록</a></p>
</body></html>
